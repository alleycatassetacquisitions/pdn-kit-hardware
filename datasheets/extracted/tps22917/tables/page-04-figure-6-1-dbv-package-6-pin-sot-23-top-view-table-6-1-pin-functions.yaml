- - '3'
  - 'ON'
  - I
  - Active high switch control input. Do not leave floating.
- - '4'
  - CT
  - O
  - Switch slew rate control. Connect capacitor from this pin to VIN to increase output
    slew rate and turn-on time. Can be left floating for fastest timing.
- - '5'
  - QOD
  - O
  - Quick Output Discharge pin. This functionality can be enabled in one of three
    ways. •Placing an external resistor between VOUT and QOD •Tying QOD directly to
    VOUT and using the internal resistor value (R) PD •Disabling QOD by leaving pin
    floatingSee the Fall Time (t) and Quick Output Discharge (QOD) section for more
    FALLinformation.
- - '6'
  - VOUT
  - O
  - Switch output
