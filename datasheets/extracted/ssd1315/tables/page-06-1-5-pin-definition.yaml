  - Power Supply for Logic This is a voltage supply pin. It must be connected to external
    source. Ground of Logic Circuit This is a ground pin. It acts as a reference for
    the logic pins. It must be connected to external ground. Power Supply for OEL
    Panel This is the most positive voltage supply pin of the chip. A stabilization
    capacitor should be connected between this pin and V when the converter is used.
    It SSmust be connected to external source when the converter is not used. Ground
    of Analog Circuit This is an analog ground pin. It should be connected to V externally.
    SS
