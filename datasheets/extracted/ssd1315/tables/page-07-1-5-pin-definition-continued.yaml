- - 7 1, 30
  - N.C. N.C. (GND)
  - '- -'
  - Reserved Pin The N.C. pin between function pins are reserved for compatible and
    flexible design. Reserved Pin (Supporting Pin) The supporting pins can reduce
    the influences from stresses on the function pins. These pins must be connected
    to external ground as the ESD protection circuit.
