- - VBUS
  - A4, B4
  - '24'
  - P
  - Charger input voltage. The internal n-channel reverse block MOSFET (RBFET) is
    connected between VBUS and PMID with VBUS on source. Place a 1-uF ceramic capacitor
    from VBUS to GND and place it as close as possible to IC.
- - Thermal Pad
  - —
  - —
  - P
  - Ground reference for the device that is also the thermal pad used to conduct heat
    from the device. This connection serves two purposes. The first purpose is to
    provide an electrical ground connection for the device. The second purpose is
    to provide a low thermal-impedance path from the device die to the PCB. This pad
    should be tied externally to a ground plane.
