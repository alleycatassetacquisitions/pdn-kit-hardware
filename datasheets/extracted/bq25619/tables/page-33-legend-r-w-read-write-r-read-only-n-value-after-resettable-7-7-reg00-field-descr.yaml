  - TS_IGNORE
  - '0'
  - R/W
  - by REG_RST
  - When charger does not monitor the NTC, host sets this bit to 1 to ignore the TS
    pin condition during charging and boost mode. 0 – Include TS pin into charge and
    boost mode enable conditions. (default) 1 – Ignore TS pin. Always consider TS
    is good to allow charging and boost mode. NTC_FAULT bits are 000 to report normal
    status.
  - ''
