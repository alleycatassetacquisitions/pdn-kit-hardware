  - BATSNS_DIS
  - '0'
  - R/W
  - by REG_RST
  - Select either BATSNS pin or BAT pin to regulate battery voltage. 0 – Enable BATSNS
    in battery CV regulation. If the device fails BATSNS open/short detection (BATSNS_STAT
    = 1). Battery voltage is regulated through BAT pin. (default) 1 – Disable BATSNS.
    Use BAT pin in battery CV regulation.
  - ''
